<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detetives do Metabolismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ff;--ink:#1e1b4b;--muted:#6b6894;--card:#ffffff;--line:#e6e1fa;
  --pri:#6d28d9;--pri2:#8b5cf6;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(circle at 8% 0%,#ede9fe 0,transparent 40%),
    radial-gradient(circle at 100% 15%,#fce7f3 0,transparent 35%),
    radial-gradient(circle at 50% 100%,#e0f2fe 0,transparent 40%),
    var(--bg);
}
h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0 0 8px}
h3{font-size:22px}
p{line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 6px 24px -14px rgba(76,29,149,.35)}
.muted{color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* Botões */
.btn{font:700 15px 'Nunito',sans-serif;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:#ede9fe;color:var(--pri);transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 22px -10px #6d28d9}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#451a03;box-shadow:0 8px 18px -10px #b45309}
.btn.ghost{background:transparent;border:1px dashed #cfc7f0;color:var(--muted)}
.big{font-size:19px;padding:14px 30px;border-radius:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:600 13px 'Nunito'}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* Setup */
.hero{text-align:center;padding:30px 10px 6px}
.hero-emoji{font-size:64px;animation:float 3s ease-in-out infinite}
.hero h1{font-size:clamp(34px,6vw,58px);background:linear-gradient(135deg,#6d28d9,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;color:var(--muted);max-width:640px;margin:6px auto}
.nbtns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.nbtn{width:56px;height:56px;border-radius:16px;font:700 22px 'Fredoka';border:2px solid var(--line);background:#faf8ff;color:var(--ink);cursor:pointer}
.nbtn.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;transform:scale(1.06)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.nameinp{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px 12px;background:#fff}
.nameinp input{border:0;outline:0;font:700 16px 'Nunito';width:100%;padding:6px 0;color:var(--ink);background:transparent}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cfg{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#faf8ff}
.cfg label{font-weight:700}
.cfg input{width:70px;font:700 16px 'Nunito';border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.specmode{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:4px 0 16px}
.smbtn{text-align:left;border:2px solid var(--line);background:#faf8ff;border-radius:14px;padding:12px 14px;cursor:pointer;font:600 14px 'Nunito';color:var(--muted)}
.smbtn b{display:block;font:700 17px 'Fredoka';color:var(--ink);margin-bottom:2px}
.smbtn.on{border-color:var(--pri);background:#f3edff;box-shadow:0 6px 16px -10px var(--pri)}
.smbtn.on b::after{content:' ✓';color:var(--pri)}
.cfg-sub{font:700 16px 'Fredoka';margin:4px 0 6px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.how{background:#faf8ff;border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.how b{font-family:'Fredoka';font-size:17px;display:block;margin-bottom:4px}

/* Topo */
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font:700 20px 'Fredoka';display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cdots{display:flex;gap:5px;flex-wrap:wrap}
.cdot{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;font:700 14px 'Fredoka';color:var(--muted);cursor:pointer}
.cdot.mid{border-color:#fbbf24;color:#b45309}
.cdot.done{background:#dcfce7;border-color:#86efac;color:#15803d}
.cdot.cur{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;transform:scale(1.1)}
.scorebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--c);border-radius:999px;padding:6px 14px;font-size:15px}
.chip .pix{font:700 16px 'Fredoka';color:var(--c)}
.lead{animation:bounce 1.4s ease-in-out infinite;display:inline-block}

/* Caso */
.casecard{background:linear-gradient(135deg,#4c1d95,#7c3aed 55%,#db2777);color:#fff;border:0;padding:26px 28px}
.case-tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font:700 13px 'Nunito';letter-spacing:.08em}
.casecard h2{font-size:clamp(26px,4vw,40px);margin:10px 0 6px}
.age{font:600 18px 'Nunito';opacity:.95}
.intro{font-size:20px;max-width:900px;margin:10px 0 0}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:700}
.step span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ede9fe;color:var(--pri);font-size:13px}
.step.now{background:var(--pri);color:#fff;border-color:transparent}
.step.now span{background:#fff}
.step.past{color:var(--ok)}
.step.past span{background:#dcfce7;color:var(--ok)}

/* Tabela de pistas */
.tablewrap{overflow-x:auto;margin-top:10px;border-radius:14px;border:1px solid var(--line)}
table.ht{border-collapse:collapse;width:100%;min-width:860px;background:#fff}
.ht th,.ht td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.ht thead th{background:#faf8ff;vertical-align:bottom}
.ht tr:last-child td{border-bottom:0}
.hh{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;line-height:1.15}
.he{font-size:24px}
.cost{margin-top:3px;background:#ede9fe;color:var(--pri);border-radius:999px;padding:2px 8px;font-size:12px}
.cost.mid{background:#fef3c7;color:#b45309}
.cost.high{background:#fee2e2;color:#b91c1c}
.ht .tn{text-align:left;position:sticky;left:0;background:#fff;min-width:150px;z-index:1}
.tn-in{display:flex;align-items:center;gap:8px;font-weight:800}
.tn small{display:block;color:var(--muted);font-weight:600;margin-left:20px}
.hb{width:46px;height:46px;border-radius:14px;border:2px dashed #d4cdf3;background:#faf8ff;font:700 20px 'Fredoka';color:#fff;cursor:pointer;transition:.15s}
.hb:hover{border-color:var(--c)}
.hb.on{background:var(--c);border:2px solid var(--c);transform:scale(1.08);box-shadow:0 6px 14px -6px var(--c)}
.tot{font:700 18px 'Fredoka';color:var(--bad);min-width:90px}
.tot small{display:block;font:600 12px 'Nunito';color:var(--muted)}

/* Caso completo */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:12px;padding:8px 14px;font:700 15px 'Nunito';cursor:pointer}
.tab small{background:#f1eefc;border-radius:999px;padding:1px 7px;margin-left:4px;font-size:12px}
.tab.on{background:var(--c);color:#fff}
.tab.on small{background:rgba(255,255,255,.25)}
.casefull{border:3px solid var(--c);border-radius:18px;padding:18px;background:#fff;scroll-margin-top:110px}
.cf-head{display:flex;align-items:center;gap:8px;font-size:20px;font-family:'Fredoka'}
.cf-intro{font-size:17px;background:#faf8ff;border-radius:12px;padding:12px 14px;margin:12px 0}
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.clue{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;animation:pop .35s ease both}
.clue-h{display:flex;align-items:center;gap:8px;font:700 17px 'Fredoka';margin-bottom:6px}
.clue-h span{font-size:24px}
.clue ul{margin:0;padding-left:20px}
.clue li{margin:4px 0;font-size:16px}
.empty{padding:16px;text-align:center;color:var(--muted);font-weight:700;background:#faf8ff;border-radius:12px}
.specbox{margin-top:12px;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#ecfeff,#f0fdf4);border:2px solid #5eead4;animation:pop .35s ease both}
.specbox p{margin:0;font-size:17px}

/* Respostas */
.arows{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.arow{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:center;border-left:6px solid var(--c);background:#faf8ff;border-radius:12px;padding:10px 12px}
.an{display:flex;align-items:center;gap:8px;font-weight:800}
.an small{color:var(--muted);font-weight:600;margin-left:auto}
.ain{font:600 17px 'Nunito';border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;background:#fff;color:var(--ink)}
.ain:focus{border-color:var(--c)}
.spec{background:#ccfbf1;color:#0f766e;white-space:nowrap}
.spec small{opacity:.8}
.spec.done{background:#0d9488;color:#fff}

/* Resultados */
.reveal{text-align:center;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #fcd34d;animation:pop .45s ease both}
.dx-label{font:700 14px 'Nunito';letter-spacing:.1em;color:#b45309;text-transform:uppercase}
.dx{font:700 clamp(26px,4vw,40px) 'Fredoka';margin:6px 0}
.reveal p{max-width:820px;margin:6px auto 0;font-size:17px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.res{border-radius:16px;padding:14px;border:3px solid var(--c);background:#fff;text-align:center;animation:pop .45s ease both}
.res.ok{background:linear-gradient(180deg,#f0fdf4,#fff)}
.res.bad{background:linear-gradient(180deg,#fef2f2,#fff)}
.res-top{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.res-icon{font-size:48px;margin:6px 0}
.res-msg{font:700 20px 'Fredoka'}
.res.ok .res-msg{color:var(--ok)}
.res.bad .res-msg{color:var(--bad)}
.res-ans{margin:6px 0;color:var(--muted);font-size:15px;word-break:break-word}
.res-foot{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:8px}

/* Pódio */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;padding-top:20px;flex-wrap:nowrap}
.pod{width:min(200px,30vw);display:flex;flex-direction:column;align-items:center}
.pod-top{text-align:center;margin-bottom:8px}
.trophy{font-size:54px;animation:bounce 1.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(180,83,9,.35))}
.pod-name{font:700 18px 'Fredoka';word-break:break-word}
.pod-pix{font:700 22px 'Fredoka';color:var(--c)}
.pod-hits{font-size:13px;color:var(--muted)}
.pod-base{width:100%;border-radius:14px 14px 4px 4px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.pod-base span{font-size:30px}
.pod-base b{font:700 24px 'Fredoka'}
.r1 .pod-base{height:150px}
.r2 .pod-base{height:110px}
.r3 .pod-base{height:80px}
.rest{max-width:560px;margin:16px auto 0;display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:#faf8ff;border-left:5px solid var(--c)}
.rname{flex:1;font-weight:700}

/* Final */
.champ{text-align:center;padding:30px 10px 0}
.confetti{font-size:34px;letter-spacing:6px}
.big-trophy{font-size:120px;animation:bounce 1.6s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(180,83,9,.35))}
.champ h1{font-size:clamp(36px,6vw,60px);color:#b45309}
.champ-name{display:inline-block;background:var(--c);color:#fff;font:700 28px 'Fredoka';padding:6px 22px;border-radius:999px;margin:4px}
.champ-pix{font:700 24px 'Fredoka';color:var(--muted);margin-top:8px}

/* Modal e toast */
.overlay{position:fixed;inset:0;background:rgba(30,27,75,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:24px;padding:24px;width:min(760px,100%);max-height:92vh;overflow:auto;position:relative;animation:pop .3s ease both}
.modal h2{text-align:center}
.x{position:absolute;top:12px;right:12px;border:0;background:#f1eefc;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 40px}

@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:720px){
  .arow{grid-template-columns:1fr}
  .intro{font-size:17px}
  .casecard{padding:20px}
  .brand span{display:none}
  .pod-name{font-size:15px}
  .trophy{font-size:40px}
}
</style>
</head>

<div id="app"></div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const HINTS = [

const DEFAULT_NAMES = ['Equipe Vermelha','Equipe Azul','Equipe Verde','Equipe Laranja','Equipe Roxa','Equipe Rosa','Equipe Turquesa'];

/* ============ CASOS ============ */
const CASES = [
{
  title:"O bebê que começou a ficar diferente",

  dx:"Fenilcetonúria (PKU)",
  note:"Deficiência na conversão da fenilalanina em tirosina (fenilalanina hidroxilase). O acúmulo de fenilalanina leva a manifestações neurológicas. É uma das doenças rastreadas na triagem neonatal.",
  accept:["fenilcetonuria","fenilceto","pku","hiperfenilalaninemia"]
},
{
  title:"O recém-nascido que não tolerava a alimentação",

  clues:{

{

  clues:{

const KEY = 'detetives-metabolismo-v1';
const A = (n,f) => Array.from({length:n}, f);
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (S && (!S.teams || !S.cs)) S = null;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

let setup = {
  n:4, names:DEFAULT_NAMES.slice(),
  cfg:{start:100, reward:25, spec:20, specMode:'material', costs:Object.fromEntries(HINTS.map(h=>[h.k,h.c]))}
};
let modal = false;

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => S.cs[S.ci];
const cost = k => S.cfg.costs[k];
const selSum = (st,t) => st.sel[t].reduce((a,k)=>a+cost(k),0);
function blankCase(n){
  return {phase:'hints', sel:A(n,()=>[]), bought:A(n,()=>[]), spec:A(n,()=>false),
          ans:A(n,()=>''), ok:A(n,()=>null), spent:A(n,()=>0), earned:A(n,()=>0), tab:0};
}
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function isMatch(answer, accept){
  const x = ' ' + norm(answer) + ' ';
  if (!x.trim()) return false;
  return accept.some(k => { const n = norm(k); return n.length <= 4 ? x.includes(' '+n+' ') : x.includes(n); });
}
function ranking(){
  const arr = S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.pix-a.pix);
  let r = 0;
  arr.forEach((t,j)=>{ if (j===0 || t.pix < arr[j-1].pix) r = j+1; t.rank = r; });
  return arr;
}
const hits = i => S.cs.filter(c => c.phase==='result' && c.ok[i]).length;
const costClass = c => c >= 12 ? 'high' : c >= 8 ? 'mid' : '';

function toast(m){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent = m; el.className = 'show';
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.className='', 2600);
}

function viewAnswers(C,st){
  return `<div class="card">
    <h3>✍️ Respostas das equipes</h3>
    <p class="muted">Digite o diagnóstico de cada equipe. Antes de enviar, a equipe pode consultar o especialista (${S.cfg.spec} pix).</p>
    <div class="arows">${S.teams.map((t,i)=>`<div class="arow" style="--c:${t.color}">
      <div class="an"><span class="dot"></span>${esc(t.name)}<small>${t.pix} pix</small></div>
      <input class="ain" data-ans="${i}" value="${esc(st.ans[i])}" placeholder="Diagnóstico da ${esc(t.name)}…" autocomplete="off">
      ${st.spec[i]
        ? `<button class="btn spec done" data-a="tab" data-t="${i}">🩺 Especialista consultado</button>`
        : `<button class="btn spec" data-a="consult" data-t="${i}" ${t.pix<S.cfg.spec?'disabled':''}>🩺 Consultar especialista <small>−${S.cfg.spec} pix</small></button>`}
    </div>`).join('')}</div>
    <div class="actions"><button class="btn btn-primary big" data-a="sendAnswers">📨 Enviar respostas</button></div>
  </div>`;
}

function podiumHTML(){
  const R = ranking(), top = R.slice(0,3);
  const order = top.length===1 ? [top[0]] : top.length===2 ? [top[1],top[0]] : [top[1],top[0],top[2]];
  const medal = ['','🥇','🥈','🥉'];
  const pods = order.map(t=>{
    const r = Math.min(t.rank,3), h = hits(t.i);
    return `<div class="pod r${r}" style="--c:${t.color}">
      <div class="pod-top">${t.rank===1?'<div class="trophy">🏆</div>':''}
        <div class="pod-name">${esc(t.name)}</div><div class="pod-pix">${t.pix} pix</div>
        <div class="pod-hits">${h} acerto${h===1?'':'s'}</div></div>
      <div class="pod-base"><span>${medal[r]}</span><b>${t.rank}º</b></div></div>`;
  }).join('');
  const rest = R.slice(3).map(t=>{const h=hits(t.i); return `<div class="rrow" style="--c:${t.color}"><b>${t.rank}º</b><span class="dot"></span><span class="rname">${esc(t.name)}</span><span class="muted">${h} acerto${h===1?'':'s'}</span><b>${t.pix} pix</b></div>`;}).join('');
  return `<div class="podium">${pods}</div>${rest?`<div class="rest">${rest}</div>`:''}`;
}

function viewResults(C,st){
  return `<div class="card reveal"><div class="dx-label">🎯 Diagnóstico</div><div class="dx">${esc(C.dx)}</div><p>${esc(C.note)}</p></div>
  <div class="card">
    <h3>📣 Resultado das equipes</h3>
    <div class="rgrid">${S.teams.map((t,i)=>{
      const ok = st.ok[i];
      return `<div class="res ${ok?'ok':'bad'}" style="--c:${t.color};animation-delay:${i*90}ms">
        <div class="res-top"><span class="dot"></span><b>${esc(t.name)}</b></div>
        <div class="res-icon">${ok?'✅':'❌'}</div>
        <div class="res-msg">${ok?`Acertou! +${st.earned[i]} pix`:'Não foi dessa vez'}</div>
        <div class="res-ans">${st.ans[i].trim()?'“'+esc(st.ans[i])+'”':'<i>sem resposta</i>'}</div>
        <div class="res-foot"><span>Gastou ${st.spent[i]} pix · Saldo <b>${t.pix} pix</b></span>
          <button class="link" data-a="override" data-t="${i}">${ok?'corrigir: marcar como errado':'corrigir: marcar como certo'}</button></div>
      </div>`;
    }).join('')}</div>
  </div>
  <div class="card"><h3>🏆 Pódio</h3>${podiumHTML()}</div>
  <div class="actions">${S.ci<CASES.length-1
    ? `<button class="btn btn-primary big" data-a="next">Próximo caso ▶</button>`
    : `<button class="btn btn-primary big" data-a="finish">🏁 Ver resultado final</button>`}</div>`;
}

function viewGame(){
  const C = CASES[S.ci], st = cur(), n = S.teams.length;
  const R = ranking(), lead = R[0].pix, allTie = R.every(t=>t.pix===lead);
  const chips = S.teams.map(t=>`<div class="chip" style="--c:${t.color}"><span class="dot"></span><b>${esc(t.name)}</b><span class="pix">${t.pix} pix</span>${(!allTie||n===1)&&t.pix===lead?'<span class="lead">🏆</span>':''}</div>`).join('');
  const dots = CASES.map((c,i)=>{const p=S.cs[i].phase; return `<button class="cdot ${p==='result'?'done':p==='answer'?'mid':''} ${i===S.ci?'cur':''}" data-a="go" data-v="${i}" title="${esc(c.title)}">${i+1}</button>`;}).join('');
  const stepIdx = ['hints','answer','result'].indexOf(st.phase);
  const steps = ['Escolher pistas','Responder','Resultado'].map((s,i)=>`<div class="step ${i<stepIdx?'past':''} ${i===stepIdx?'now':''}"><span>${i<stepIdx?'✓':i+1}</span>${s}</div>`).join('');

  let body = '';
  if (st.phase==='hints') body = viewHints(C,st);
  else if (st.phase==='answer') body = viewCaseFull(C,st) + viewAnswers(C,st);
  else body = viewResults(C,st) + viewCaseFull(C,st);

  return `<header class="top"><div class="top-in">
      <div class="brand"><button class="btn" data-a="home" title="Voltar ao início">🏠 Início</button>🧬 <span>Detetives do Metabolismo</span></div>
      <div class="nav">
        <button class="btn" data-a="prev" ${S.ci===0?'disabled':''}>◀</button>
        <div class="cdots">${dots}</div>
        <button class="btn" data-a="next" ${S.ci===CASES.length-1?'disabled':''}>▶</button>
      </div>
      <button class="btn btn-gold" data-a="podium">🏆 Placar</button>
    </div></header>
    <div class="wrap">
      <div class="scorebar">${chips}</div>
      <section class="card casecard">
        <div class="case-tag">CASO ${S.ci+1} DE ${CASES.length}</div>
        <h2>${esc(C.title)}</h2>
        <div class="age">🩺 ${esc(C.age)}</div>
        <p class="intro">${esc(C.intro)}</p>
      </section>
      <div class="steps">${steps}</div>
      ${body}
      <div class="foot">
        <button class="btn ghost" data-a="resetCase">↺ Reiniciar este caso</button>
        ${S.ci===CASES.length-1 && st.phase!=='result' ? '' : ''}
        <button class="btn ghost" data-a="finish">🏁 Encerrar jogo</button>
        <button class="btn ghost" data-a="newGame">🗑 Novo jogo</button>
      </div>
    </div>`;
}

function viewFinal(){
  const R = ranking(), champs = R.filter(t=>t.rank===1);
  return `<div class="wrap">
    <div class="champ">
      <div class="confetti">🎉 🎊 🧬 🎊 🎉</div>
      <div class="big-trophy">🏆</div>
      <h1>${champs.length>1?'Empate no topo!':'Campeã!'}</h1>
      <div>${champs.map(t=>`<span class="champ-name" style="--c:${t.color}">${esc(t.name)}</span>`).join(' ')}</div>
      <div class="champ-pix">${R[0].pix} pix</div>
    </div>
    <div class="card"><h3>🏆 Pódio final</h3>${podiumHTML()}</div>
    <div class="actions">
      <button class="btn" data-a="home">🏠 Início</button>
      <button class="btn" data-a="back">◀ Voltar aos casos</button>
      <button class="btn btn-primary" data-a="newGame">Novo jogo</button>
    </div>
  </div>`;
}

function render(){
  let html = (!S || S.screen==='home') ? viewSetup() : S.screen==='final' ? viewFinal() : viewGame();
  if (modal && S && S.screen!=='home') html += `<div class="overlay" data-a="close"><div class="modal" data-a="noop"><button class="x" data-a="close">✕</button><h2>🏆 Placar geral</h2>${podiumHTML()}</div></div>`;
  $app.innerHTML = html;
}

/* ============ AÇÕES ============ */
const ACT = {
  noop(){},
  setSpec(b){ setup.cfg.specMode = b.dataset.v; render(); },
  setN(b){ setup.n = +b.dataset.v; render(); },
  start(){
    if (S && !confirm('Começar um novo jogo? O jogo atual (pontuação e casos) será apagado.')) return;
    const n = setup.n, cfg = JSON.parse(JSON.stringify(setup.cfg));
    S = { cfg, ci:0, screen:'game',
          teams: A(n,(_,i)=>({name:(setup.names[i]||'').trim()||DEFAULT_NAMES[i], color:COLORS[i], pix:cfg.start})),
          cs: CASES.map(()=>blankCase(n)) };
    save(); render(); scrollTo(0,0);
  },
  toggle(b){
    const t = +b.dataset.t, k = b.dataset.k, st = cur();
    if (st.phase!=='hints') return;
    const s = st.sel[t], idx = s.indexOf(k);
    if (idx>=0) s.splice(idx,1);
    else {
      if (selSum(st,t)+cost(k) > S.teams[t].pix) return toast(`💸 ${S.teams[t].name} não tem pix suficiente para essa pista!`);
      s.push(k);
    }
    save(); render();
  },
  sendHints(){
    const st = cur();
    const none = st.sel.every(s=>!s.length);
    if (!confirm(none ? 'Nenhuma equipe escolheu pistas. Enviar mesmo assim?' : 'Enviar as pistas e revelar o caso de cada equipe?')) return;
    S.teams.forEach((t,i)=>{
      const c = selSum(st,i);
      t.pix -= c; st.spent[i] += c;
      st.bought[i] = HINTS.map(h=>h.k).filter(k=>st.sel[i].includes(k));
    });
    st.phase = 'answer'; st.tab = 0;
    save(); render(); toast('Pistas reveladas! 🔍');
  },
  tab(b){
    cur().tab = +b.dataset.t; save(); render();
    document.getElementById('casefull')?.scrollIntoView({behavior:'smooth', block:'start'});
  },
  consult(b){
    const t = +b.dataset.t, st = cur(), team = S.teams[t];
    if (st.phase!=='answer' || st.spec[t]) return;
    if (team.pix < S.cfg.spec) return toast(`💸 ${team.name} não tem pix suficiente para o especialista.`);
    if (!confirm(`${team.name} vai consultar o especialista por ${S.cfg.spec} pix. Confirmar?`)) return;
    team.pix -= S.cfg.spec; st.spent[t] += S.cfg.spec; st.spec[t] = true; st.tab = t;
    save(); render();
    if (S.cfg.specMode==='equipe') { toast(`🙋 ${team.name} pode pedir ajuda a uma equipe agora!`); return; }
    toast(`🩺 ${team.name} consultou o especialista!`);
    document.getElementById('casefull')?.scrollIntoView({behavior:'smooth', block:'start'});
  },
  sendAnswers(){
    const st = cur(); if (st.phase!=='answer') return;
    document.querySelectorAll('[data-ans]').forEach(el=>st.ans[+el.dataset.ans] = el.value);
    const empty = st.ans.filter(a=>!a.trim()).length;
    if (!confirm(empty ? `${empty} equipe(s) sem resposta. Enviar mesmo assim?` : 'Enviar as respostas e revelar o resultado?')) return;
    const C = CASES[S.ci];
    S.teams.forEach((t,i)=>{
      const ok = isMatch(st.ans[i], C.accept);
      st.ok[i] = ok;
      if (ok){ t.pix += S.cfg.reward; st.earned[i] = S.cfg.reward; }
    });
    st.phase = 'result';
    save(); render(); scrollTo({top:0, behavior:'smooth'});
    const n = st.ok.filter(Boolean).length;
    toast(n ? `🎉 ${n} equipe${n>1?'s acertaram':' acertou'}!` : 'Ninguém acertou dessa vez 😅');
  },
  override(b){
    const t = +b.dataset.t, st = cur(); if (st.phase!=='result') return;
    if (!st.ok[t]){ st.ok[t] = true; S.teams[t].pix += S.cfg.reward; st.earned[t] = S.cfg.reward; }
    else { st.ok[t] = false; S.teams[t].pix -= st.earned[t]; st.earned[t] = 0; }
    save(); render();
  },
  go(b){ S.ci = +b.dataset.v; save(); render(); scrollTo({top:0, behavior:'smooth'}); },
  prev(){ if (S.ci>0) ACT.go({dataset:{v:S.ci-1}}); },
  next(){ if (S.ci<CASES.length-1) ACT.go({dataset:{v:S.ci+1}}); },
  finish(){ if (S.cs.some(c=>c.phase!=='result') && !confirm('Ainda há casos sem resultado. Ver o resultado final mesmo assim?')) return; S.screen='final'; save(); render(); scrollTo(0,0); },
  home(){
    setup.n = S.teams.length;
    S.teams.forEach((t,i)=>{ setup.names[i] = t.name; });
    setup.cfg = JSON.parse(JSON.stringify(S.cfg));
    modal = false; S.screen = 'home'; save(); render(); scrollTo(0,0);
  },
  resume(){ S.screen = 'game'; save(); render(); scrollTo(0,0); },
  back(){ S.screen='game'; save(); render(); },
  podium(){ modal = true; render(); },
  close(){ modal = false; render(); },
  resetCase(){
    if (!confirm('Reiniciar este caso? Os pix gastos e ganhos nele serão devolvidos/retirados.')) return;
    const st = cur();
    S.teams.forEach((t,i)=>{ t.pix += st.spent[i] - st.earned[i]; });
    S.cs[S.ci] = blankCase(S.teams.length);
    save(); render(); toast('Caso reiniciado ↺');
  },
  newGame(){
    if (!confirm('Apagar o jogo atual e começar um novo?')) return;
    S = null; modal = false; setup.names = DEFAULT_NAMES.slice();
    try { localStorage.removeItem(KEY); } catch(e) {}
    render(); scrollTo(0,0);
  }
};

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.a];
  if (f){ if (b.dataset.a!=='noop') e.stopPropagation(); f(b); }
});
document.addEventListener('input', e=>{
  const el = e.target, d = el.dataset;
  if (d.ans!==undefined && S){ cur().ans[+d.ans] = el.value; save(); }
  else if (d.name!==undefined){ setup.names[+d.name] = el.value; }
  else if (d.cfg){ setup.cfg[d.cfg] = Math.max(0, parseInt(el.value)||0); }
  else if (d.cost){ setup.cfg.costs[d.cost] = Math.max(0, parseInt(el.value)||0); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && modal){ modal=false; render(); }
  if (e.key==='Enter' && e.target.dataset && e.target.dataset.ans!==undefined){
    const nx = document.querySelector(`[data-ans="${+e.target.dataset.ans+1}"]`);
    nx ? nx.focus() : e.target.blur();
  }
});

render();
</script>
</body>
</html>
